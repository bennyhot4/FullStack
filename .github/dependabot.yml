version: 2
# Every update targets the working main branch (not the old default branch "master"), so updates are
# tested against the current code. Change it here if the main branch is ever renamed.
updates:
  # Keeps the SHA-pinned actions current (Dependabot updates the SHA and the "# vX.Y.Z" comment).
  - package-ecosystem: github-actions
    directory: /
    target-branch: claude/app-development-plan-imirl7
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: nuget
    directory: /backend
    target-branch: claude/app-development-plan-imirl7
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      nuget-minor-patch:
        update-types: [minor, patch]

  # The site (plan 009): React runtime + Vite/TypeScript/ESLint dev tools. Minor/patch grouped like NuGet.
  - package-ecosystem: npm
    directory: /frontend
    target-branch: claude/app-development-plan-imirl7
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      npm-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /e2e
    target-branch: claude/app-development-plan-imirl7
    schedule:
      interval: weekly
    cooldown:
      default-days: 7

  - package-ecosystem: docker
    directory: /backend
    target-branch: claude/app-development-plan-imirl7
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    # Stay on .NET 8 (net8.0 target) until a planned upgrade.
    ignore:
      - dependency-name: "mcr.microsoft.com/dotnet/*"
        update-types: [version-update:semver-major]
