name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

# Least privilege: every job only reads the repository unless it says otherwise.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: "8.0.x"
      - run: dotnet build -c Release
      # Integration tests start a real mongod that ships inside a NuGet package; no services needed.
      - run: dotnet test -c Release --no-build

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      # React + TypeScript site built by Vite (plan 009); dependencies pinned by frontend/package-lock.json.
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      # Informational only (plan 009, Q7): raw + gzip size of every file that would be deployed.
      - name: Size report
        run: npm run size
      - name: Syntax check (e2e)
        working-directory: e2e
        run: find . -maxdepth 1 -name '*.mjs' | sort | xargs -n1 node --check

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build API image (no push)
        run: docker build -t houroffice-api:ci backend

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: "8.0.x"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      # The e2e test runs against the production build of the site, served by `vite preview`.
      - name: Build site
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm run build
      # Playwright is pinned by e2e/package-lock.json.
      - name: Install Playwright
        working-directory: e2e
        run: |
          npm ci --no-audit --no-fund
          npx --no-install playwright install --with-deps chromium
      - name: Build API
        run: dotnet build -c Release backend/HourOffice.Api
      - name: Start API (Development, dev login) and site
        run: |
          mkdir -p "$RUNNER_TEMP/logs"
          (cd backend/HourOffice.Api && ASPNETCORE_ENVIRONMENT=Development nohup dotnet run -c Release --no-build --no-launch-profile --urls http://localhost:5080 > "$RUNNER_TEMP/logs/api.log" 2>&1 &)
          (cd frontend && nohup npx --no-install vite preview --port 5500 --strictPort > "$RUNNER_TEMP/logs/web.log" 2>&1 &)
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:5080/healthz > /dev/null && curl -fsS http://localhost:5500/ > /dev/null; then echo "ready"; exit 0; fi
            sleep 2
          done
          echo "API or site did not start"; cat "$RUNNER_TEMP/logs/api.log" "$RUNNER_TEMP/logs/web.log"; exit 1
      - name: Smoke test (phone, he + en)
        run: node e2e/smoke.mjs "$RUNNER_TEMP/screenshots"
      - name: Upload screenshots and logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-failure
          path: |
            ${{ runner.temp }}/screenshots
            ${{ runner.temp }}/logs
          retention-days: 7
